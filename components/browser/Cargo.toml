[package]
name = "browser"
version = "0.1.0"
edition = "2024"

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
# Not `rashomon:browser` — that package name is already taken by the
# `rashomon:browser` WIT primitive itself (wit/deps/browser.wit), which
# this component imports from.
package = "rashomon:browser-facet"

[package.metadata.component.target]
path = "../../wit"
world = "facet-world"

[package.metadata.component.target.dependencies]
"rashomon:graph" = { path = "../../wit/deps/graph.wit" }
"rashomon:facet" = { path = "../../wit/deps/facet.wit" }
"rashomon:process" = { path = "../../wit/deps/process.wit" }
"rashomon:browser" = { path = "../../wit/deps/browser.wit" }

[package.metadata.component.dependencies]
