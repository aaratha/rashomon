[package]
name = "rashomon-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rashomon-kernel"
path = "src/main.rs"

[dependencies]
rashomon-graph = { path = "../rashomon-graph" }

wasmtime = { version = "49.0.1", features = ["component-model"] }
wasmtime-wasi = "49.0.1"
wasmtime-wasi-http = "49.0.1"

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

anyhow = "1"
thiserror = "2"

# Off by default. Pulls in the Tauri-maintained CEF bindings so
# `rashomon:browser` can eventually be backed by a real browser engine.
# Nothing in this crate calls into it yet — see README.md for what
# enabling this feature actually requires at build time.
cef = { version = "154.0.0", optional = true }
directories = "6.0.0"
winit = "0.30.13"
softbuffer = "0.4.8"
portable-pty = "0.9.0"
noto-sans-mono-bitmap = "0.3.2"

[features]
browser = ["dep:cef"]
