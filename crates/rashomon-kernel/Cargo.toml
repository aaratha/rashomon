[package]
name = "rashomon-kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "rashomon_kernel"
path = "src/lib.rs"

[[bin]]
name = "rashomon-kernel"
path = "src/main.rs"

[[bin]]
name = "rashomon-kernel-helper"
path = "src/helper.rs"

[package.metadata.cef.bundle]
helper_name = "rashomon-kernel-helper"

[dependencies]
rashomon-graph = { path = "../rashomon-graph" }

wasmtime = { version = "49.0.1", features = ["component-model"] }
wasmtime-wasi = "49.0.1"
wasmtime-wasi-http = "49.0.1"

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

anyhow = "1"
thiserror = "2"

# The Tauri-maintained CEF bindings — the Native Backend for both
# `rashomon:browser` and windowing/UI generally now (see the module doc
# comment). `sandbox` is off: the macOS app-bundle-with-helper-processes
# structure it needs is still required either way (see
# `crates/cef-spike`), but skipping the OS-level sandbox itself keeps
# this validation's settings simple.
cef = { version = "154.0.0", default-features = false, features = ["build-util", "resources"] }
directories = "6.0.0"
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [] }
