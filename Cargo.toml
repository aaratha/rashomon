[workspace]
resolver = "2"
members = [
    "crates/rashomon-graph",
    "crates/rashomon-kernel",
]
# The `ping` component targets wasm32-wasip1 via cargo-component and has
# its own toolchain/dependency graph (see components/ping/README or the
# root README) — it is built independently, not as a workspace member.
exclude = ["components/ping"]

[workspace.package]
edition = "2021"
