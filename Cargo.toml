[workspace]
resolver = "2"
members = [
    "crates/rashomon-graph",
    "crates/rashomon-kernel",
]
# The `ping`/`shell` components target wasm32-wasip1 via cargo-component
# and have their own toolchain/dependency graph (see components/ping/README
# or the root README) — they are built independently, not as workspace
# members.
#
# `cef-spike` is a standalone CEF bootstrap validation, kept out of the
# main workspace while its native CEF build/link story is still unproven
# — see crates/cef-spike.
exclude = [
    "components/ping",
    "components/shell",
    "components/terminal",
    "components/terminal-xterm",
    "components/browser",
    "components/sidebar",
    "components/graph-view",
    "crates/cef-spike",
    "crates/cef-extension-spike",
]

[workspace.package]
edition = "2021"
